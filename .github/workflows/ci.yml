name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check . --select E,F,I,W --ignore E501

      - name: Ruff format check
        run: ruff format --check .

      - name: Black format check
        run: black --check .

      - name: Tests
        run: pytest -v --tb=short

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install dbt-core==1.8.7 dbt-duckdb==1.8.3

      - name: dbt deps + parse
        working-directory: dbt
        run: |
          dbt deps
          dbt parse --profiles-dir .
