name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff pytest requests

      - name: Lint
        run: ruff check . --select E,F,I,W --ignore E501

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest scraper/tests/ -v --tb=short

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-core dbt-databricks

      - name: dbt deps + parse
        working-directory: dbt
        run: |
          dbt deps
          dbt parse --profiles-dir .
