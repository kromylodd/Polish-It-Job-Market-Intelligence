name: Deploy Bundle

on:
  workflow_dispatch: # Manual only until Databricks secrets are configured

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate bundle
        run: databricks bundle validate -t prod --var="warehouse_id=${{ secrets.DATABRICKS_WAREHOUSE_ID }}"

      - name: Deploy bundle
        run: databricks bundle deploy -t prod --var="warehouse_id=${{ secrets.DATABRICKS_WAREHOUSE_ID }}"
