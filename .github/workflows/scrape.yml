name: Daily Scrape

on:
  schedule:
    # Run daily at 06:00 UTC (08:00 Warsaw time)
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python -m scraper.scraper

      - name: Upload to Databricks Volume
        run: |
          # Upload the latest raw JSON file to Unity Catalog Volume
          LATEST_FILE=$(ls -t data/raw_listings_*.json 2>/dev/null | head -1)
          if [ -z "$LATEST_FILE" ]; then
            echo "No output file found — scraper may have failed"
            exit 1
          fi
          echo "Uploading: $LATEST_FILE"
          python -m scraper.uploader "$LATEST_FILE"

      # Fallback: trigger Databricks Workflow via API since file-arrival
      # triggers don't work on Free Edition, then poll the run to completion so
      # the notify job only starts once gold data is actually ready.
      - name: Trigger Databricks Workflow and wait
        if: success()
        run: |
          set -euo pipefail
          if [ -z "${DATABRICKS_JOB_ID}" ]; then
            echo "DATABRICKS_JOB_ID secret is not set" >&2
            exit 1
          fi

          RUN_ID=$(curl -sS --fail-with-body -X POST "${DATABRICKS_HOST}/api/2.1/jobs/run-now" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": ${DATABRICKS_JOB_ID}}" | python -c 'import sys,json; print(json.load(sys.stdin)["run_id"])')
          echo "Triggered Databricks run_id=${RUN_ID}"

          # Poll run status until terminal (max ~20 min).
          DEADLINE=$(( $(date +%s) + 1200 ))
          while true; do
            RESP=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
              "${DATABRICKS_HOST}/api/2.1/jobs/runs/get?run_id=${RUN_ID}")
            LIFECYCLE=$(echo "$RESP" | python -c 'import sys,json; print(json.load(sys.stdin)["state"]["life_cycle_state"])')
            RESULT=$(echo "$RESP" | python -c 'import sys,json; print(json.load(sys.stdin)["state"].get("result_state",""))')
            echo "run ${RUN_ID}: ${LIFECYCLE} ${RESULT}"
            case "$LIFECYCLE" in
              TERMINATED|SKIPPED|INTERNAL_ERROR)
                if [ "$RESULT" != "SUCCESS" ]; then
                  echo "Databricks run did not succeed (result=${RESULT})" >&2
                  exit 1
                fi
                break
                ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Timed out waiting for Databricks run ${RUN_ID}" >&2
              exit 1
            fi
            sleep 20
          done

  # Telegram notifications (runs after the pipeline has completed)
  notify:
    runs-on: ubuntu-latest
    needs: scrape-and-upload
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests databricks-sql-connector databricks-sdk

      - name: Send Telegram notifications
        run: python -m telegram_bot.notify
