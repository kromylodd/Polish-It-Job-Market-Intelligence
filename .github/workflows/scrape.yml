name: Daily Scrape

on:
  schedule:
    # Run daily at 04:30 UTC (06:30 Warsaw / CEST, 05:30 CET).
    # Deliberately off the top of the hour: Free Edition job-trigger throttling
    # (FEATURE_DISABLED) correlates with peak :00 scheduling contention, so an
    # off-peak minute reduces how often the trigger step gets throttled.
    - cron: "30 4 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python -m scraper.scraper

      - name: Upload to Databricks Volume
        run: |
          # Upload the latest raw JSON file to Unity Catalog Volume
          LATEST_FILE=$(ls -t data/raw_listings_*.json 2>/dev/null | head -1)
          if [ -z "$LATEST_FILE" ]; then
            echo "No output file found — scraper may have failed"
            exit 1
          fi
          echo "Uploading: $LATEST_FILE"
          python -m scraper.uploader "$LATEST_FILE"

      # Fallback: trigger Databricks Workflow via API since file-arrival
      # triggers don't work on Free Edition, then poll the run to completion so
      # the notify job only starts once gold data is actually ready.
      - name: Trigger Databricks Workflow and wait
        if: success()
        run: |
          set -euo pipefail
          if [ -z "${DATABRICKS_JOB_ID}" ]; then
            echo "DATABRICKS_JOB_ID secret is not set" >&2
            exit 1
          fi

          # Normalize host: ensure https:// scheme (the secret may store bare hostname)
          DB_HOST="${DATABRICKS_HOST}"
          DB_HOST="${DB_HOST#https://}"
          DB_HOST="${DB_HOST#http://}"
          DB_HOST="https://${DB_HOST%/}"
          echo "Using Databricks host: ${DB_HOST}"

          # Trigger with retries — Free Edition sometimes returns FEATURE_DISABLED
          # (HTTP 404) when the org is temporarily throttled. The throttle can
          # outlast a short window, so retry up to 30 min before giving up.
          TRIGGER_DEADLINE=$(( $(date +%s) + 1800 ))
          TRIGGER_ATTEMPT=0
          RUN_ID=""
          while true; do
            TRIGGER_ATTEMPT=$((TRIGGER_ATTEMPT + 1))
            HTTP_CODE=$(curl -sS -o /tmp/trigger_resp.json -w "%{http_code}" \
              -X POST "${DB_HOST}/api/2.1/jobs/run-now" \
              -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"job_id\": ${DATABRICKS_JOB_ID}}")

            if [ "$HTTP_CODE" = "200" ]; then
              RUN_ID=$(python -c 'import sys,json; print(json.load(open("/tmp/trigger_resp.json"))["run_id"])')
              break
            fi

            RESP_BODY=$(cat /tmp/trigger_resp.json 2>/dev/null || echo "")
            echo "Trigger attempt ${TRIGGER_ATTEMPT} failed (HTTP ${HTTP_CODE}): ${RESP_BODY}"

            # Retry on transient/throttle errors (429, 5xx, FEATURE_DISABLED 404)
            if echo "$RESP_BODY" | grep -qi "FEATURE_DISABLED\|temporarily"; then
              echo "Databricks org temporarily throttled — will retry..."
            elif [ "$HTTP_CODE" -ge 500 ] || [ "$HTTP_CODE" = "429" ]; then
              echo "Server error / rate limit — will retry..."
            else
              echo "Non-retryable error (HTTP ${HTTP_CODE}). Aborting." >&2
              exit 1
            fi

            if [ "$(date +%s)" -ge "$TRIGGER_DEADLINE" ]; then
              echo "Timed out trying to trigger Databricks job (${TRIGGER_ATTEMPT} attempts over 30 min)" >&2
              echo "The raw data was already uploaded to the Volume; the pipeline can be run manually from the Databricks UI once the org is un-throttled." >&2
              exit 1
            fi
            BACKOFF=$(( 30 * TRIGGER_ATTEMPT ))
            [ "$BACKOFF" -gt 120 ] && BACKOFF=120
            echo "Waiting ${BACKOFF}s before retry..."
            sleep "$BACKOFF"
          done

          echo "Triggered Databricks run_id=${RUN_ID}"

          # Poll run status until terminal (max ~20 min).
          DEADLINE=$(( $(date +%s) + 1200 ))
          while true; do
            RESP=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
              "${DB_HOST}/api/2.1/jobs/runs/get?run_id=${RUN_ID}")
            LIFECYCLE=$(echo "$RESP" | python -c 'import sys,json; print(json.load(sys.stdin)["state"]["life_cycle_state"])')
            RESULT=$(echo "$RESP" | python -c 'import sys,json; print(json.load(sys.stdin)["state"].get("result_state",""))')
            echo "run ${RUN_ID}: ${LIFECYCLE} ${RESULT}"
            case "$LIFECYCLE" in
              TERMINATED|SKIPPED|INTERNAL_ERROR)
                if [ "$RESULT" != "SUCCESS" ]; then
                  echo "Databricks run did not succeed (result=${RESULT})" >&2
                  exit 1
                fi
                break
                ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Timed out waiting for Databricks run ${RUN_ID}" >&2
              exit 1
            fi
            sleep 20
          done

  # Telegram notifications (runs after the pipeline has completed)
  notify:
    runs-on: ubuntu-latest
    needs: scrape-and-upload
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests databricks-sql-connector databricks-sdk

      - name: Send Telegram notifications
        run: python -m telegram_bot.notify
