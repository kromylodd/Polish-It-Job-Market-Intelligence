name: Daily Scrape

on:
  schedule:
    # Run at 03:00 UTC (05:00 Warsaw). Pipeline completes well before the
    # fixed 08:00 Warsaw broadcast.
    - cron: "0 3 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      PIPELINE_DIR: ${{ secrets.PIPELINE_DIR || '/home/kromylodd/polish-it-job-market-intelligence' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python -m scraper.scraper

      - name: Verify scraper output
        run: |
          LATEST_FILE="data/raw_listings_latest.json"
          if [ ! -f "$LATEST_FILE" ]; then
            echo "No output file found — scraper may have failed"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$LATEST_FILE")
          echo "Output file: $LATEST_FILE (${FILE_SIZE} bytes)"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "File suspiciously small — scraper may have returned empty data"
            exit 1
          fi

      - name: Set up SSH key
        run: |
          # Guard: fail fast if SSH secrets are not configured
          if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ] || [ -z "$VM_SSH_KEY" ]; then
            echo "❌ ERROR: One or more SSH secrets are empty."
            echo "   Set VM_HOST, VM_USER, and VM_SSH_KEY in GitHub repo Settings → Secrets → Actions."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          # Add VM host key to known_hosts (avoids interactive prompt)
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code and deps on VM
        run: |
          ssh -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
            "${VM_USER}@${VM_HOST}" \
            "cd ${PIPELINE_DIR} && git pull --ff-only origin main && .venv-pipeline/bin/pip install -q -r pipeline-requirements.txt && mkdir -p data && echo '==> Sync complete'"

      - name: SCP data to VM
        run: |
          scp -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
            data/raw_listings_latest.json \
            "${VM_USER}@${VM_HOST}:${PIPELINE_DIR}/data/raw_listings_latest.json"
          echo "Uploaded data to VM"

      - name: Trigger pipeline on VM
        run: |
          set -o pipefail
          ssh -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
            "${VM_USER}@${VM_HOST}" \
            "cd ${PIPELINE_DIR} && .venv-pipeline/bin/python -m pipeline.run_pipeline 2>&1" | tee /tmp/pipeline_output.log
          echo "Pipeline completed"

      - name: Verify pipeline success
        run: |
          # Check pipeline output for success indicator
          if grep -q "PIPELINE COMPLETE" /tmp/pipeline_output.log; then
            echo "✅ Pipeline completed successfully"
          else
            echo "❌ Pipeline may have failed — check logs above"
            exit 1
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vm_key

  # NOTE: Telegram broadcast is decoupled from this pipeline.
  # The bot (running 24/7 on the VM) sends daily alerts at exactly 08:00 Warsaw,
  # reading from whatever data was last processed by the pipeline.
