# Lakeview dashboard (BI companion to the Telegram bot) over the gold marts.
#
# The dashboard needs a SQL warehouse to run its queries. Per this project's
# no-hardcoded-infra rule, the id comes from a bundle variable — supply it at
# deploy time, e.g.:
#   databricks bundle deploy -t prod --var="warehouse_id=<id>"
# or export DATABRICKS_BUNDLE_VAR_warehouse_id=<id>.

resources:
  dashboards:
    job_market_overview:
      display_name: "Polish IT Job Market — Overview"
      file_path: ../dashboards/job_market_overview.lvdash.json
      warehouse_id: ${var.warehouse_id}
