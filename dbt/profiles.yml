job_market:
  target: local
  outputs:
    # Local DuckDB — used by the self-hosted pipeline on the VM.
    # Reads/writes to the same pipeline.duckdb file the bot serves from.
    local:
      type: duckdb
      path: "{{ env_var('PIPELINE_DB_PATH', '../pipeline.duckdb') }}"
      schema: gold
      threads: 1

    # Used by CI (GitHub Actions) for dbt parse/compile — validates SQL without
    # connecting. For dbt-duckdb this just needs a path (can be in-memory).
    ci:
      type: duckdb
      path: ":memory:"
      schema: gold
      threads: 1
