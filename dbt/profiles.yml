job_market:
  target: ci
  outputs:
    # Used by CI (GitHub Actions) for dbt parse — dummy values are fine since
    # parse doesn't actually connect to a warehouse.
    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'dummy-for-ci') }}"
      http_path: "/sql/1.0/warehouses/dummy"
      token: "{{ env_var('DATABRICKS_TOKEN', 'dummy-for-ci') }}"
      catalog: job_market
      schema: gold

    # Used when running dbt inside Databricks workflow notebooks.
    # Token-based auth against the SQL warehouse — required because dbt runs
    # in a subprocess that doesn't have access to the notebook's Spark session.
    # host and http_path are injected via env vars by run_dbt.py / run_dbt_test.py
    # (DATABRICKS_HOST from the Spark conf, DATABRICKS_HTTP_PATH from the
    # DATABRICKS_WAREHOUSE_ID secret). Nothing workspace-specific is hardcoded here.
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: job_market
      schema: gold
