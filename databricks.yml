# Databricks Asset Bundle configuration

bundle:
  name: polish-it-job-market-intelligence

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: >-
      SQL warehouse ID backing the Lakeview dashboard queries. Not hardcoded
      (Free-Edition-specific); supply at deploy time via
      --var="warehouse_id=<id>" or DATABRICKS_BUNDLE_VAR_warehouse_id.
    default: ""

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
