# Databricks Asset Bundle configuration
# See: https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: polish-it-job-market-intelligence

include:
  - resources/*.yml

workspace:
  host: ${var.databricks_host}

variables:
  databricks_host:
    description: "Databricks workspace URL"
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.user_name}/.bundle/${bundle.name}/dev

  prod:
    mode: production
    workspace:
      root_path: /Users/${workspace.current_user.user_name}/.bundle/${bundle.name}/prod
