# Databricks Asset Bundle configuration

bundle:
  name: polish-it-job-market-intelligence

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.user_name}/.bundle/${bundle.name}/dev

  prod:
    mode: production
    workspace:
      root_path: /Users/${workspace.current_user.user_name}/.bundle/${bundle.name}/prod
